<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Fun4Two – Mirror Avatar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; color: #eaf2f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* camera preview (mirrored) with skeleton overlay */
  #preview { position: fixed; right: 12px; top: max(12px, env(safe-area-inset-top)); width: 28vw; max-width: 180px; min-width: 100px;
    aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.25);
    background: #000; display: none; }
  #preview video, #preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  #status { position: fixed; left: 12px; top: max(12px, env(safe-area-inset-top)); font-size: 13px; padding: 6px 10px;
    border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); max-width: 60vw; }
  #status.ok::before { content: "● "; color: #4ade80; }
  #status.warn::before { content: "● "; color: #fbbf24; }

  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: rgba(10,16,22,.78); backdrop-filter: blur(4px); }
  #menu h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  #menu p { margin: 0; max-width: 420px; line-height: 1.45; color: #b8c7d3; font-size: 15px; }
  button { font: inherit; font-weight: 600; font-size: 17px; padding: 14px 28px; border-radius: 14px; border: 0; cursor: pointer;
    background: #38bdf8; color: #04141f; min-width: 220px; }
  button.secondary { background: transparent; color: #b8c7d3; border: 1px solid rgba(255,255,255,.25); font-size: 15px; padding: 10px 20px; }
  button:disabled { opacity: .6; }
  #stars { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); display: none;
    gap: 10px; font-size: 38px; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  #stars span { color: rgba(255,255,255,.45); transition: transform .25s, color .25s; }
  #stars span.on { color: #ffd23f; transform: scale(1.25); }
  #err { color: #fca5a5; font-size: 14px; max-width: 420px; min-height: 1em; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="preview"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
<div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
<div id="status" class="warn">Not started</div>

<div id="menu">
  <h1>Mirror Avatar</h1>
  <p>Stand back so your head, shoulders and arms are visible to the front camera. Pop the bubbles with your hands and wave to make the animals dance!</p>
  <button id="startBtn">Start camera</button>
  <button id="demoBtn" class="secondary">Demo without camera</button>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ *
 *  Scene
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);   // lowered automatically if the phone struggles
renderer.setPixelRatio(pixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 10, 30);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8fbf8f, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 48),
  new THREE.MeshLambertMaterial({ color: 0x7ed07e })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.55, 0.6, 48),
  new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.005;
scene.add(ring);

let camDist = 4;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // make sure a ~2.6 wide x 2.1 tall region around the avatar always fits (portrait phones need to back off)
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const distH = (2.1 / 2) / Math.tan(fov / 2);
  const distW = (2.6 / 2) / (Math.tan(fov / 2) * camera.aspect);
  const dist = Math.max(distH, distW);
  camDist = dist;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ *
 *  Avatar (faces +Z, i.e. towards the viewer; its right arm is on screen-left, like a mirror)
 * ------------------------------------------------------------------ */
const SHOULDER_Y = 1.42, SHOULDER_X = 0.23;
const UPPER = 0.32, FORE = 0.30;          // arm segment lengths
const skin = new THREE.MeshLambertMaterial({ color: 0xf2c6a0 });
const shirt = new THREE.MeshLambertMaterial({ color: 0x38bdf8 });
const pants = new THREE.MeshLambertMaterial({ color: 0x334155 });
const dark = new THREE.MeshLambertMaterial({ color: 0x111111 });

function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; }

const avatar = new THREE.Group();
scene.add(avatar);

// torso, pelvis, neck, head, face
avatar.add(mesh(new THREE.CapsuleGeometry(0.2, 0.34, 6, 16), shirt, 0, 1.18, 0).rotateZ(0)); // chest
avatar.children[0].scale.set(1.15, 1, 0.75);
avatar.add(mesh(new THREE.CylinderGeometry(0.2, 0.19, 0.2, 16), pants, 0, 0.84, 0));
avatar.add(mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.1, 12), skin, 0, 1.52, 0));
const head = mesh(new THREE.SphereGeometry(0.14, 24, 18), skin, 0, 1.68, 0);
head.add(mesh(new THREE.SphereGeometry(0.022, 10, 8), dark, -0.05, 0.02, 0.125));
head.add(mesh(new THREE.SphereGeometry(0.022, 10, 8), dark, 0.05, 0.02, 0.125));
const smile = mesh(new THREE.TorusGeometry(0.04, 0.008, 6, 14, Math.PI), dark, 0, -0.04, 0.128);
smile.rotation.z = Math.PI;
head.add(smile);
avatar.add(head);
// legs
for (const sx of [-1, 1]) {
  avatar.add(mesh(new THREE.CapsuleGeometry(0.075, 0.62, 6, 12), pants, sx * 0.1, 0.42, 0));
  avatar.add(mesh(new THREE.BoxGeometry(0.13, 0.07, 0.22), dark, sx * 0.1, 0.035, 0.04));
}

// arm: a group whose local -Y axis runs along the limb
function makeLimb(len, radius, mat, tip) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CapsuleGeometry(radius, len - radius * 2, 6, 12), mat, 0, -len / 2, 0));
  if (tip) g.add(mesh(new THREE.SphereGeometry(tip, 14, 12), skin, 0, -len, 0));
  avatar.add(g);
  return g;
}
function makeArm(side) {   // side: -1 = avatar's right (screen-left), +1 = avatar's left
  return {
    sx: side * SHOULDER_X,
    upper: makeLimb(UPPER, 0.052, shirt),
    fore: makeLimb(FORE, 0.045, skin, 0.06),
    dUpper: new THREE.Vector3(side * 0.15, -1, 0).normalize(),   // smoothed directions
    dFore:  new THREE.Vector3(side * 0.10, -1, 0).normalize(),
    tUpper: new THREE.Vector3(), tFore: new THREE.Vector3(),
  };
}
const rightArm = makeArm(-1);  // follows the user's RIGHT arm (MediaPipe landmarks 12/14/16)
const leftArm  = makeArm(+1);  // follows the user's LEFT arm  (11/13/15)

const DOWN = new THREE.Vector3(0, -1, 0);
const _q = new THREE.Quaternion();
function poseArm(arm, k) {
  arm.dUpper.lerp(arm.tUpper, k).normalize();
  arm.dFore.lerp(arm.tFore, k).normalize();
  arm.upper.position.set(arm.sx, SHOULDER_Y, 0);
  arm.upper.quaternion.copy(_q.setFromUnitVectors(DOWN, arm.dUpper));
  arm.fore.position.set(arm.sx, SHOULDER_Y, 0).addScaledVector(arm.dUpper, UPPER);
  arm.fore.quaternion.copy(_q.setFromUnitVectors(DOWN, arm.dFore));
}
function setRest(arm, side) {
  arm.tUpper.set(side * 0.15, -1, 0).normalize();
  arm.tFore.set(side * 0.10, -1, 0).normalize();
}
setRest(rightArm, -1); setRest(leftArm, +1);

/* ------------------------------------------------------------------ *
 *  Landmarks -> arm directions
 *  MediaPipe world coords: x → image right, y ↓, z → away from camera (metres, origin at hips).
 *  Camera image is un-mirrored, so the user's right arm has smaller x; our avatar faces the viewer,
 *  so its right arm is also at -x. Mapping is therefore (x, -y, -z).
 * ------------------------------------------------------------------ */
const V = (p) => new THREE.Vector3(p.x, -p.y, -p.z);
const MIN_VIS = 0.45;
function updateArmFromPose(arm, side, world, lm, iS, iE, iW) {
  const vis = Math.min(lm[iS].visibility ?? 1, lm[iE].visibility ?? 1, lm[iW].visibility ?? 1);
  if (vis < MIN_VIS) { setRest(arm, side); return; }  // arm out of view: relax it
  const S = V(world[iS]), E = V(world[iE]), W = V(world[iW]);
  const d1 = E.sub(S), d2 = W.sub(E);
  if (d1.lengthSq() < 1e-6 || d2.lengthSq() < 1e-6) return;
  arm.tUpper.copy(d1).normalize();
  arm.tFore.copy(d2).normalize();
}

/* ------------------------------------------------------------------ *
 *  Demo mode (no camera): waves the arms around
 * ------------------------------------------------------------------ */
let demo = false;
function demoPose(t) {                         // sweep arms around to pop bubbles
  const a = Math.sin(t * 2.2), b = Math.sin(t * 2.2 + 1.5);
  rightArm.tUpper.set(-0.7, 0.6 * a, 0.3).normalize();
  rightArm.tFore.set(-0.5, 0.8 * a + 0.3, 0.4).normalize();
  leftArm.tUpper.set(0.7, 0.6 * b, 0.3).normalize();
  leftArm.tFore.set(0.5, 0.8 * b + 0.3, 0.4).normalize();
}

/* ------------------------------------------------------------------ *
 *  Camera + MediaPipe pose tracking
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const statusEl = $('status'), errEl = $('err'), menu = $('menu');
const video = $('video'), overlay = $('overlay'), preview = $('preview');
const octx = overlay.getContext('2d');
function setStatus(text, cls = 'ok') { statusEl.textContent = text; statusEl.className = cls; }

let landmarker = null;
let tracking = false;
let lastVideoTime = -1;
let lastSeen = 0;

async function startTracking() {
  $('startBtn').disabled = true; $('demoBtn').disabled = true;
  errEl.textContent = '';
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera API unavailable. Open this page over HTTPS (or localhost).');
    }
    setStatus('Requesting camera…', 'warn');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    preview.style.display = 'block';

    setStatus('Loading pose model…', 'warn');
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const modelPath = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
    const make = (delegate) => vision.PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: modelPath, delegate },
      runningMode: 'VIDEO', numPoses: 1,
      minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    try { landmarker = await make('GPU'); } catch (e) { console.warn('GPU delegate failed, using CPU', e); landmarker = await make('CPU'); }

    tracking = true;
    menu.style.display = 'none'; showStars();
    setStatus('Looking for you…', 'warn');
  } catch (e) {
    console.error(e);
    errEl.textContent = (e && e.message) ? e.message : String(e);
    setStatus('Error', 'warn');
    $('startBtn').disabled = false; $('demoBtn').disabled = false;
  }
}

const OVERLAY_LINES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
function drawOverlay(lm) {
  const w = video.videoWidth || 320, h = video.videoHeight || 240;
  if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
  octx.clearRect(0, 0, w, h);
  if (!lm) return;
  octx.lineWidth = Math.max(2, w / 120); octx.strokeStyle = '#4ade80'; octx.fillStyle = '#fbbf24';
  for (const [a, b] of OVERLAY_LINES) {
    octx.beginPath(); octx.moveTo(lm[a].x * w, lm[a].y * h); octx.lineTo(lm[b].x * w, lm[b].y * h); octx.stroke();
  }
  for (const i of [11,12,13,14,15,16]) { octx.beginPath(); octx.arc(lm[i].x * w, lm[i].y * h, octx.lineWidth * 1.4, 0, 7); octx.fill(); }
}

let lastDetect = 0;
function detect(now) {
  if (!tracking || video.readyState < 2 || video.currentTime === lastVideoTime || now - lastDetect < 50) return;
  lastVideoTime = video.currentTime; lastDetect = now;
  const res = landmarker.detectForVideo(video, now);
  if (res.landmarks && res.landmarks.length && res.worldLandmarks.length) {
    const lm = res.landmarks[0], world = res.worldLandmarks[0];
    updateArmFromPose(rightArm, -1, world, lm, 12, 14, 16);
    updateArmFromPose(leftArm, +1, world, lm, 11, 13, 15);
    drawOverlay(lm);
    lastSeen = now;
    setStatus('Tracking', 'ok');
  } else {
    drawOverlay(null);
    if (now - lastSeen > 1000) {            // lost you for a second: relax arms
      setRest(rightArm, -1); setRest(leftArm, +1);
      setStatus('No person visible', 'warn');
    }
  }
}

$('startBtn').addEventListener('click', () => { initAudio(); startTracking(); });
$('demoBtn').addEventListener('click', () => { initAudio(); demo = true; showStars(); menu.style.display = 'none'; setStatus('Demo mode', 'ok'); });

/* ------------------------------------------------------------------ *
 *  Sound (tiny synthesized tones, no files)
 * ------------------------------------------------------------------ */
let actx = null;
function initAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
}
function tone(freq, dur = 0.25, type = 'sine', vol = 0.25, when = 0, slideTo = 0) {
  if (!actx) return;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
}
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];   // pentatonic: always sounds nice
function popSound() { const f = NOTES[Math.floor(Math.random() * NOTES.length)]; tone(f, 0.18, 'sine', 0.3, 0, f * 1.7); }
function celebrateSound() { NOTES.concat(NOTES[5] * 1.25).forEach((f, i) => tone(f, 0.35, 'triangle', 0.22, i * 0.09)); }

/* ------------------------------------------------------------------ *
 *  Sparkles
 * ------------------------------------------------------------------ */
const NP = 260;
const pPos = new Float32Array(NP * 3), pCol = new Float32Array(NP * 3), pVel = new Float32Array(NP * 3), pLife = new Float32Array(NP);
pPos.fill(-100);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const sparkles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.11, vertexColors: true, transparent: true, depthWrite: false }));
sparkles.frustumCulled = false;
scene.add(sparkles);
let pNext = 0;
function burst(pos, color, n = 18, speed = 1.4) {
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    const i = pNext; pNext = (pNext + 1) % NP;
    pPos.set([pos.x, pos.y, pos.z], i * 3);
    const th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), sp = speed * (0.4 + Math.random());
    pVel.set([sp * Math.sin(ph) * Math.cos(th), sp * Math.sin(ph) * Math.sin(th) + 0.4, sp * Math.cos(ph)], i * 3);
    const white = Math.random() < 0.35;
    pCol.set([white ? 1 : c.r, white ? 1 : c.g, white ? 1 : c.b], i * 3);
    pLife[i] = 0.7 + Math.random() * 0.5;
  }
  sparkAlive = 1;
}
let sparkAlive = 0;
function updateSparkles(dt) {
  if (!sparkAlive) return;
  sparkAlive = 0;
  for (let i = 0; i < NP; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = -100; continue; }
    sparkAlive++;
    pVel[i * 3 + 1] -= 1.2 * dt;
    for (let a = 0; a < 3; a++) pPos[i * 3 + a] += pVel[i * 3 + a] * dt;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 *  Bubbles: float near the avatar's hands; touch one to pop it
 * ------------------------------------------------------------------ */
const bubbleGeo = new THREE.SphereGeometry(1, 20, 16);
const PASTELS = [0xff9ec7, 0xffd166, 0x9be7a6, 0xa5b4ff, 0xff9a76, 0x7fe3f0];
const bubbles = [];
const MAX_BUBBLES = 4;
let spawnTimer = 0.3;

function spawnBubble() {
  const side = Math.random() < 0.5 ? -1 : 1;
  const withAnimal = Math.random() < 0.5 && bubbles.filter((x) => x.animal).length < 2;
  const r = withAnimal ? 0.3 : 0.2 + Math.random() * 0.08;
  const color = PASTELS[Math.floor(Math.random() * PASTELS.length)];
  const m = new THREE.Mesh(bubbleGeo, new THREE.MeshLambertMaterial({
    color, emissive: color, emissiveIntensity: 0.25, transparent: true, opacity: 0.0 }));
  const base = new THREE.Vector3(side * (0.2 + Math.random() * 0.4),
                                 SHOULDER_Y - 0.1 + Math.random() * 0.6, 0.05 + Math.random() * 0.2);
  m.position.copy(base);
  scene.add(m);
  let animal = null;
  if (withAnimal) { animal = makeAnimal(ANIMALS[Math.floor(Math.random() * ANIMALS.length)]); scene.add(animal); }
  bubbles.push({ m, base, r, color, animal, age: 0, life: 10 + Math.random() * 4, phase: Math.random() * 6.28 });
}
function removeBubble(b) { if (b.animal) scene.remove(b.animal); scene.remove(b.m); b.m.material.dispose(); bubbles.splice(bubbles.indexOf(b), 1); }

const starEls = [...document.querySelectorAll('#stars span')];
let starCount = 0;
function showStars() { $('stars').style.display = 'flex'; }
function addStar() {
  starCount++;
  starEls.forEach((el, i) => el.classList.toggle('on', i < starCount));
  if (starCount >= starEls.length) {                    // 5 pops = party!
    celebrateSound();
    burst(new THREE.Vector3(0, 1.4, 0.3), 0xffd23f, 90, 2.6);
    burst(new THREE.Vector3(0, 1.4, 0.3), 0xff9ec7, 60, 2.2);
    setTimeout(() => { starCount = 0; starEls.forEach((el) => el.classList.remove('on')); }, 900);
  }
}

const _h = new THREE.Vector3();
function handWorld(arm, out) {
  return out.copy(arm.fore.position).addScaledVector(arm.dFore, FORE);
}
function updateBubbles(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0 && bubbles.length < MAX_BUBBLES) { spawnBubble(); spawnTimer = 0.6 + Math.random() * 0.8; }
  for (const b of [...bubbles]) {
    b.age += dt; b.base.y += 0.02 * dt;                          // drift up slowly
    const fade = Math.min(b.age / 0.5, 1) * Math.min((b.life - b.age) / 1.0, 1);
    b.m.material.opacity = 0.65 * Math.max(fade, 0);
    b.m.position.set(b.base.x + Math.sin(b.age * 1.3 + b.phase) * 0.03, b.base.y + Math.sin(b.age * 1.7 + b.phase) * 0.03, b.base.z);
    b.m.scale.setScalar(b.r * (1 + 0.04 * Math.sin(b.age * 5 + b.phase)));
    if (b.animal) {                                           // animal rides inside the bubble
      b.animal.position.set(b.m.position.x, b.m.position.y - 0.15, b.m.position.z);
      b.animal.rotation.y = Math.sin(b.age * 1.5) * 0.6;
      b.animal.scale.setScalar(0.5 * Math.max(fade, 0.01));
    }
    if (b.age > b.life) { removeBubble(b); continue; }
    if (b.age < 0.4) continue;
    for (const arm of [rightArm, leftArm]) {
      if (handWorld(arm, _h).distanceTo(b.m.position) < b.r + 0.1) {
        const pos = b.m.position.clone(), an = b.animal;
        popSound(); burst(pos, b.color); addStar();
        b.animal = null; removeBubble(b);
        if (an) freeAnimal(an, pos);
        break;
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Wave detection (drives the animals' dance)
 * ------------------------------------------------------------------ */
let waveE = 0, prevR = null, prevL = null;
const armHandY = (a) => a.dUpper.y * UPPER + a.dFore.y * FORE;     // hand height relative to the shoulder
function updateWave(dt) {
  const rY = armHandY(rightArm), lY = armHandY(leftArm);
  if (prevR !== null) waveE += ((Math.abs(rY - prevR) + Math.abs(lY - prevL)) / 2 / dt - waveE) * Math.min(1, dt * 3);
  prevR = rY; prevL = lY;
}

/* ------------------------------------------------------------------ *
 *  Animals: built from simple shapes. Freed from bubbles, they land in the meadow and dance when you wave.
 * ------------------------------------------------------------------ */
const ANIMALS = ['duck', 'pig', 'cow', 'cat'];
const SPH = new THREE.SphereGeometry(1, 16, 12), CONE = new THREE.ConeGeometry(1, 1, 12), CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
const matCache = {};
const M = (c) => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));
function part(geo, color, sx, sy, sz, x, y, z, rx = 0, rz = 0) {
  const m = new THREE.Mesh(geo, M(color)); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.rotation.set(rx, 0, rz); return m;
}
function makeAnimal(type) {
  const g = new THREE.Group(); g.userData.type = type;
  const eyes = (y, z, dx = 0.06) => { for (const sx of [-1, 1]) g.add(part(SPH, 0x111111, 0.028, 0.028, 0.028, sx * dx, y, z)); };
  const legs = (color, xs, zs, h, r) => { for (const x of xs) for (const z of zs) g.add(part(CYL, color, r, h / 2, r, x, h / 2, z)); };
  if (type === 'duck') {
    g.add(part(SPH, 0xffd93d, 0.2, 0.17, 0.24, 0, 0.2, 0));
    g.add(part(SPH, 0xffd93d, 0.14, 0.14, 0.14, 0, 0.42, 0.14));
    g.add(part(SPH, 0xff9f1c, 0.07, 0.03, 0.06, 0, 0.4, 0.27));
    g.add(part(CONE, 0xffd93d, 0.06, 0.12, 0.06, 0, 0.28, -0.24, -1.0));
    for (const sx of [-1, 1]) g.add(part(SPH, 0xff9f1c, 0.05, 0.015, 0.07, sx * 0.07, 0.015, 0.05));
    eyes(0.45, 0.125, 0.06);
  } else if (type === 'pig') {
    g.add(part(SPH, 0xffa8b8, 0.22, 0.19, 0.27, 0, 0.24, 0));
    g.add(part(SPH, 0xffa8b8, 0.16, 0.15, 0.15, 0, 0.38, 0.22));
    g.add(part(CYL, 0xff8fa3, 0.06, 0.03, 0.06, 0, 0.36, 0.35, Math.PI / 2));
    for (const sx of [-1, 1]) g.add(part(CONE, 0xff8fa3, 0.05, 0.1, 0.03, sx * 0.09, 0.52, 0.19, 0, -sx * 0.5));
    g.add(part(SPH, 0xff8fa3, 0.04, 0.04, 0.04, 0, 0.27, -0.28));
    legs(0xff8fa3, [-0.1, 0.1], [-0.12, 0.12], 0.1, 0.04);
    eyes(0.42, 0.34 - 0.13 + 0.03, 0.065);
  } else if (type === 'cow') {
    g.add(part(SPH, 0xffffff, 0.21, 0.2, 0.3, 0, 0.3, 0));
    for (const [x, y, z, a, b] of [[0.19, 0.34, 0.05, 0.05, 0.1], [-0.19, 0.28, -0.1, 0.05, 0.09], [0.1, 0.46, -0.1, 0.08, 0.05]])
      g.add(part(SPH, 0x222222, a, b, 0.09, x, y, z));
    g.add(part(SPH, 0xffffff, 0.15, 0.14, 0.14, 0, 0.45, 0.28));
    g.add(part(SPH, 0xffb3c1, 0.09, 0.06, 0.06, 0, 0.41, 0.4));
    for (const sx of [-1, 1]) {
      g.add(part(CONE, 0xf1e3c0, 0.03, 0.08, 0.03, sx * 0.1, 0.6, 0.26));
      g.add(part(SPH, 0x222222, 0.06, 0.03, 0.04, sx * 0.17, 0.5, 0.27));
    }
    legs(0xffffff, [-0.1, 0.1], [-0.17, 0.17], 0.15, 0.045);
    eyes(0.49, 0.41, 0.06);
  } else {   // cat
    g.add(part(SPH, 0xff9f43, 0.15, 0.15, 0.2, 0, 0.22, 0));
    g.add(part(SPH, 0xff9f43, 0.13, 0.12, 0.12, 0, 0.42, 0.14));
    for (const sx of [-1, 1]) g.add(part(CONE, 0xff9f43, 0.05, 0.09, 0.03, sx * 0.07, 0.55, 0.14, 0, -sx * 0.15));
    g.add(part(CYL, 0xff9f43, 0.025, 0.12, 0.025, 0, 0.32, -0.25, -0.6));
    g.add(part(SPH, 0xff6b81, 0.02, 0.015, 0.015, 0, 0.4, 0.255));
    legs(0xff9f43, [-0.07, 0.07], [-0.1, 0.1], 0.1, 0.03);
    eyes(0.45, 0.245, 0.05);
  }
  return g;
}
function animalSound(type) {
  if (type === 'duck') { tone(520, 0.12, 'sawtooth', 0.09, 0, 380); tone(500, 0.12, 'sawtooth', 0.09, 0.16, 360); }
  else if (type === 'pig') { tone(260, 0.12, 'sawtooth', 0.09, 0, 180); tone(240, 0.14, 'sawtooth', 0.09, 0.15, 150); }
  else if (type === 'cow') { tone(170, 0.7, 'sawtooth', 0.08, 0, 115); tone(340, 0.7, 'sine', 0.05, 0, 230); }
  else { tone(700, 0.2, 'triangle', 0.2, 0, 1000); tone(950, 0.3, 'triangle', 0.2, 0.2, 500); }
}

const SLOTS = [[-0.95, 0.6], [0.95, 0.6], [-0.5, 1.1], [0.5, 1.1], [-1.15, 0.1], [1.15, 0.1], [-0.8, -0.9], [0.8, -0.9]];
const meadow = [];     // animals living on the grass
const MEADOW_SCALE = 0.85;
function freeAnimal(g, from) {
  let slot = SLOTS.findIndex((_, i) => !meadow.some((a) => a.slot === i));
  if (slot < 0) {                                         // meadow full: oldest animal leaves
    const old = meadow.shift(); scene.remove(old.g); slot = old.slot;
  }
  const [x, z] = SLOTS[slot];
  meadow.push({ g, slot, state: 'fall', t: 0, from: from.clone().add(new THREE.Vector3(0, -0.15, 0)), to: new THREE.Vector3(x, 0, z),
                hop: 0, nextHop: 2 + Math.random() * 3, phase: Math.random() * 6.28 });
  setTimeout(() => animalSound(g.userData.type), 120);
}
function hopAnimal(a, sound) { a.hop = 1; if (sound) animalSound(a.g.userData.type); }

let danceTimer = 0;
function updateMeadow(dt, time) {
  const dancing = waveE > 0.6;
  if (dancing) {
    if (danceTimer <= 0 && meadow.length) animalSound(meadow[Math.floor(Math.random() * meadow.length)].g.userData.type);
    danceTimer = 1.5;
  } else danceTimer = Math.max(0, danceTimer - dt);
  for (const a of meadow) {
    const g = a.g;
    if (a.state === 'fall') {                             // arc from the bubble down to its spot
      a.t = Math.min(1, a.t + dt / 1.2);
      const k = a.t, e = k * k * (3 - 2 * k);
      g.position.set(a.from.x + (a.to.x - a.from.x) * e, a.from.y + (a.to.y - a.from.y) * k + Math.sin(k * Math.PI) * 0.5, a.from.z + (a.to.z - a.from.z) * e);
      g.scale.setScalar(THREE.MathUtils.lerp(0.5, MEADOW_SCALE, e));
      g.rotation.y += dt * 8 * (1 - k);
      if (a.t >= 1) { a.state = 'idle'; hopAnimal(a, false); burst(g.position.clone().add(new THREE.Vector3(0, 0.2, 0)), 0xffffff, 10, 0.8); }
      continue;
    }
    a.nextHop -= dt;
    if (a.nextHop <= 0) { hopAnimal(a, false); a.nextHop = 2 + Math.random() * 4; }
    a.hop = Math.max(0, a.hop - dt * 2.2);
    let y = Math.sin(a.hop * Math.PI) * 0.2, sway = 0;
    if (danceTimer > 0) { y = Math.max(y, Math.abs(Math.sin(time * 9 + a.phase)) * 0.18); sway = Math.sin(time * 9 + a.phase) * 0.18; }
    g.position.set(a.to.x, y, a.to.z);
    g.rotation.set(0, -Math.atan(a.to.x / 4), sway);
    g.scale.set(MEADOW_SCALE, MEADOW_SCALE * (1 - 0.06 * Math.sin(time * 3 + a.phase)), MEADOW_SCALE);
  }
}

// tap an animal on the screen to make it hop and speak
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(meadow.filter((a) => a.state === 'idle').map((a) => a.g), true)[0];
  if (hit) { initAudio(); const a = meadow.find((m) => m.g === hit.object.parent); if (a) hopAnimal(a, true); }
});

/* ------------------------------------------------------------------ *
 *  Farm in the background: barn, silo, windmill, hay bales, fence, trees, hills and a sun
 * ------------------------------------------------------------------ */
const BOX = new THREE.BoxGeometry(1, 1, 1);
const farm = new THREE.Group(); scene.add(farm);
function fp(geo, color, sx, sy, sz, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = part(geo, color, sx, sy, sz, x, y, z, rx, rz); m.rotation.y = ry; farm.add(m); return m;
}
// barn
{
  const bx = -1.2, bz = -5.5;
  fp(BOX, 0xc0392b, 1.8, 1.0, 1.3, bx, 0.5, bz);
  fp(BOX, 0x7a2a20, 1.15, 0.07, 1.5, bx - 0.5, 1.3, bz, 0, 0, 0.55);
  fp(BOX, 0x7a2a20, 1.15, 0.07, 1.5, bx + 0.5, 1.3, bz, 0, 0, -0.55);
  const tri = new THREE.Shape(); tri.moveTo(-0.9, 0); tri.lineTo(0.9, 0); tri.lineTo(0, 0.55);
  const gable = new THREE.Mesh(new THREE.ShapeGeometry(tri), M(0xc0392b)); gable.position.set(bx, 1.0, bz + 0.651); farm.add(gable);
  fp(BOX, 0xffffff, 0.56, 0.66, 0.015, bx, 0.33, bz + 0.655);
  fp(BOX, 0x7b3f1d, 0.5, 0.6, 0.02, bx, 0.3, bz + 0.662);
  fp(BOX, 0xffffff, 0.05, 0.6, 0.025, bx, 0.3, bz + 0.67, 0, 0, 0.8);
  fp(BOX, 0xffffff, 0.05, 0.6, 0.025, bx, 0.3, bz + 0.67, 0, 0, -0.8);
}
// silo
fp(CYL, 0xcfd8dc, 0.3, 1.8, 0.3, -2.3, 0.9, -5.9);
fp(SPH, 0x90a4ae, 0.3, 0.25, 0.3, -2.3, 1.8, -5.9);
// round hay bales
fp(CYL, 0xe9c46a, 0.25, 0.32, 0.25, 1.6, 0.25, -3.6, Math.PI / 2);
fp(CYL, 0xe9c46a, 0.25, 0.32, 0.25, 2.05, 0.25, -3.9, Math.PI / 2);
fp(CYL, 0xd9b45a, 0.25, 0.32, 0.25, 1.82, 0.7, -3.75, Math.PI / 2);
// fence
for (let x = -4.2; x <= 4.3; x += 0.7) fp(BOX, 0xf5f0e6, 0.05, 0.45, 0.05, x, 0.225, -3);
fp(BOX, 0xf5f0e6, 8.6, 0.04, 0.03, 0, 0.2, -3);
fp(BOX, 0xf5f0e6, 8.6, 0.04, 0.03, 0, 0.38, -3);
// trees
for (const [x, z, sc] of [[2.5, -4.8, 1.2], [3.4, -8, 1.4], [-3.4, -6.8, 1.3], [3.8, -9.5, 1.5], [-4.4, -9.5, 1.5], [0.4, -9.5, 1.2]]) {
  fp(CYL, 0x8d5a2b, 0.07 * sc, 0.55 * sc, 0.07 * sc, x, 0.275 * sc, z);
  fp(SPH, 0x3f9e4d, 0.42 * sc, 0.42 * sc, 0.42 * sc, x, 0.85 * sc, z);
  fp(SPH, 0x57b95f, 0.3 * sc, 0.3 * sc, 0.3 * sc, x, 1.2 * sc, z);
}
// windmill (blades turn)
fp(new THREE.CylinderGeometry(0.14, 0.24, 2.2, 8), 0xf5f0e6, 1, 1, 1, 1.15, 1.1, -6.5);
fp(CONE, 0xc0392b, 0.2, 0.35, 0.2, 1.15, 2.37, -6.5);
const blades = new THREE.Group(); blades.position.set(1.15, 2.1, -6.22); farm.add(blades);
for (let i = 0; i < 4; i++) {
  const b = part(BOX, 0xffffff, 0.09, 0.75, 0.02, 0, 0, 0); b.geometry = BOX;
  const arm = new THREE.Group(); arm.rotation.z = i * Math.PI / 2; b.position.y = 0.4; arm.add(b); blades.add(arm);
}
// distant hills and sun
for (const [x, z, sx, sy, sz, c] of [[-6, -18, 10, 4, 4, 0x6bbf6b], [7, -20, 12, 5, 4, 0x5aad5a], [0, -25, 18, 6, 4, 0x7ccc7c]]) fp(SPH, c, sx, sy, sz, x, -sy * 0.3, z);
const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff3a0, fog: false }));
sunDisc.position.set(2.4, 5.5, -14); scene.add(sunDisc);

/* ------------------------------------------------------------------ *
 *  Clouds
 * ------------------------------------------------------------------ */
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const clouds = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) {
    const s = mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.25, 12, 10), cloudMat, k * 0.4 - 0.6, Math.random() * 0.15, Math.random() * 0.2);
    g.add(s);
  }
  g.position.set(-6 + Math.random() * 12, 2.4 + i * 0.7, -4 - Math.random() * 6);
  g.scale.setScalar(0.65);
  g.userData.speed = 0.08 + Math.random() * 0.15;
  scene.add(g); clouds.push(g);
}

/* ------------------------------------------------------------------ *
 *  Main loop
 * ------------------------------------------------------------------ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (demo) demoPose(now / 1000);
  else detect(now);
  const k = 1 - Math.exp(-dt * 25);
  poseArm(rightArm, k); poseArm(leftArm, k);
  updateWave(dt);
  updateBubbles(dt);
  updateSparkles(dt);
  updateMeadow(dt, now / 1000);
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 7) c.position.x = -7; }
  // gentle idle sway of the head + camera follows the avatar up
  head.rotation.y = Math.sin(now / 1200) * 0.08;
  blades.rotation.z = now / 1000 * 0.9;
  camera.position.set(0, 1.05, camDist);
  camera.lookAt(0, 0.95, 0);
  renderer.render(scene, camera);
  // if the phone can't keep ~40fps, render at lower resolution
  slowT += (dt > 0.025 ? dt : 0) ; fastT += dt;
  if (fastT > 2) { if (slowT / fastT > 0.5 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); } slowT = fastT = 0; }
}
let slowT = 0, fastT = 0;
requestAnimationFrame(frame);

// handy for debugging / future game logic
window.__game = { scene, avatar, rightArm, leftArm, bubbles, meadow };
</script>
